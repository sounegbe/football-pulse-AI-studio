<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Football Pulse AI Studio</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1220;color:#eef3fc}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#172b4b,#0b1220 65%)}main{width:min(100%,440px);background:#131f32;border:1px solid #33445f;border-radius:20px;padding:32px;box-shadow:0 24px 70px #0006}h1{margin:0 0 8px;font-size:1.8rem}p{color:#b7c6dc;line-height:1.5}label{display:block;margin:18px 0 7px;font-weight:600}input{width:100%;padding:13px;border:1px solid #62738d;border-radius:9px;background:#0b1526;color:white;font:inherit}input:focus{outline:2px solid #76adff;outline-offset:2px}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:#70a8ff;color:#091322;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.65;cursor:wait}a{color:#9dc3ff}#message{min-height:1.5em}#message.error{color:#ffb6b6}#message.success{color:#a8e6c0}</style></head>
<body><main><h1>Join Football Pulse AI Studio</h1><p>Create your account to get started.</p>
<form id="registration"><label for="username">Username</label><input id="username" name="username" required autocomplete="username" minlength="3" maxlength="64">
<label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="new-password" minlength="12" maxlength="128"><p>Use at least 12 characters.</p>
<button id="submit" type="submit">Create account</button><p id="message" role="status" aria-live="polite"></p></form><p>Already registered? <a href="/desktop">Sign in</a></p></main>
<script>
document.getElementById('registration').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('message');button.disabled=true;message.className='';message.textContent='Creating account…';try{const response=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Request':'1'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const data=await response.json();if(!response.ok){throw new Error(data?.detail?.message||data?.detail||'Registration failed. Please try again.')}message.className='success';message.textContent='Account created. Redirecting to sign in…';document.getElementById('password').value='';setTimeout(()=>location.assign('/desktop'),900)}catch(error){message.className='error';message.textContent=typeof error.message==='string'?error.message:'Registration failed.'}finally{button.disabled=false}});
</script></body></html>
